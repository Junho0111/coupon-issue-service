services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coupon
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon
    ports:
      - "3306:3306" #외부포트(로컬내부)/내부포트(도커내부)
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"] # 잘 뜨고있는지 확인는지 확인
      interval: 5s # 5초간격
      timeout: 3s
      retries: 20  # 재시도 20

  coupon-service:
    # 이미지 빌드: coupon-service/coupon 디렉토리에서 ./gradlew jibDockerBuild
    image: coupon-service:latest
    depends_on:
      mysql:
        condition: service_healthy # 디비를 먼저 띄우고 서버를 띄우겠다는것
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coupon
      SPRING_DATASOURCE_USERNAME: coupon
      SPRING_DATASOURCE_PASSWORD: coupon
    ports:
      - "8080:8080" #외부포트(로컬내부)/내부포트(도커내부)

volumes: # MySql 크기
  mysql-data:

# docker-compose up -d    <= 백그라운드(데몬) 모드로 컨테이너들(위의 설정 기반)을 실행 및 시작
# docker-compose down -v  <= 도커내리고(볼륨까지 삭제)
# docker-compose exec mysql mysql -ucoupon -p coupon <= 컨테이너 내부에 들어가 coupon 데이터베이스에 coupon 유저로 직접 접속

# ./gradlew --stop && ./gradlew jibDockerBuild && docker compose up -d
# ./gradlew --stop          <= 기존에 도커 데몬이 있으면 멈추고
# ./gradlew jibDockerBuild  <= jib빌드로 도커 이미지를 만들고

#  docker compose up -d    <= 이어서 위의 스크립트로 컨테이너에 추가
