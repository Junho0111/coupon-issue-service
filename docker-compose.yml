services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coupon
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon
    ports:
      - "3306:3306" # 외부포트(로컬내부)/내부포트(도커내부)
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"] # 잘 뜨고있는지 확인는지 확인
      interval: 5s # 5초 간격
      timeout: 3s
      retries: 20  # 재시도 20번

  redis:
    image: redis:8.0
    # redis는 원래 메모리에 저장되지만 appendonly 모드를 사용하면 redis에 기록되는 데이터들이 영속적으로 디스크에 저장됨
    # (해당 테스트 특성상 Lua 스크립트 안에 들어있는 값들이 재시작이 되어도 유지가 되어야하므로 사용하는것이고 실제 운영에서는 정말 필요할때만 사용)
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379" # 외부포트(로컬내부)/내부포트(도커내부)
    volumes:
      - redis-data:/data # 특정 컨테이너안에 경로 맵핑
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s # 5초 간격
      timeout: 3s  # 타임아웃 3초
      retries: 20  # 재시도 20번

  kafka:
    # Kafka 3.8 부터 KRaft 모드가 기본이라 ZooKeeper 없음.
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1 # 로컬 테스트 특성상 리소스를 덜 쓰기위해 단일 노드로 진행(보통 운영에서는 3개 혹은 5개 이상 사용)
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # KRaft 모드에서 쿼럼 구성, 즉 노드가 한개가 아니고 여러개일때 그중 하나가 또는 여러개가 잘못되서 리더라는 노드가 사라질때 다음 리더는 누구로 할것인가에대한 설정
      # 해당 설정의 경우 하나밖에 없으니 1번으로 했고 위치는 9093(CONTROLLER)에 있다는 의미
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 아래는 Topic설정
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # 복제 개수(카프카의 내구성을 위해)
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094" # 외부포트(로컬내부)/내부포트(도커내부)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 20

  coupon-service:
    # 이미지 빌드: coupon-service/coupon 디렉토리에서 ./gradlew jibDockerBuild
    image: coupon-service:latest
    depends_on:
      mysql:
        condition: service_healthy # DB를 띄우고 서버를 띄우겠다는것
      redis:
        condition: service_healthy # Redis를 띄우고 서버를 띄우겠다는것
      kafka:
        condition: service_healthy # Kafka를 띄우고 서버를 띄우겠다는것
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coupon
      SPRING_DATASOURCE_USERNAME: coupon
      SPRING_DATASOURCE_PASSWORD: coupon
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092 # 컨테이너 내부 네트워크에서 Kafka 접속
    ports:
      - "8080:8080" # 외부포트(로컬내부)/내부포트(도커내부)

volumes: # MySql 크기, Redis 크기
  mysql-data:
  redis-data:

# docker-compose up -d    <= 백그라운드(데몬) 모드로 컨테이너들(위의 설정 기반)을 실행 및 시작
# docker-compose down -v  <= 도커내리고(볼륨까지 삭제)
# docker-compose exec mysql mysql -ucoupon -p coupon <= 컨테이너 내부에 들어가 coupon 데이터베이스에 coupon 유저로 직접 접속

# ./gradlew --stop && ./gradlew jibDockerBuild && docker compose up -d
# ./gradlew --stop          <= 기존에 도커 데몬이 있으면 멈추고
# ./gradlew jibDockerBuild  <= jib빌드로 도커 이미지를 만들고

#  docker compose up -d    <= 이어서 위의 스크립트로 컨테이너에 추가