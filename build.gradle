buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath 'org.ow2.asm:asm:9.8'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.cloud.tools.jib' version '3.4.4' // 플러그인 추가
}

group = 'com.apiece'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

jib {
	from { // 무엇을 가지고 이미지를 만들것인지?
		image = 'eclipse-temurin:25-jre' // JDK 버전에 맞춰 설정
		platforms {
			platform {
				architecture = 'arm64'
				os = 'linux'
			}
		}
	}
	to { // 산출할 산출물/결과는 어떻게 셋팅할 것인지?
		image = 'coupon-service'
		tags = ['latest', project.version.toString()]
	}
	container { // 포트와같은 다른 설정
		ports = ['8080']
		creationTime = 'USE_CURRENT_TIMESTAMP'
	}
}